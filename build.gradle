plugins {
    id "java"
    id "war"
    id "eclipse-wtp"
    id "org.springframework.boot" version "2.7.18"
    id "io.spring.dependency-management" version "1.1.6"
    id "org.owasp.dependencycheck" version "12.2.1"
}

group = "com.realhogoo"
version = "0.0.1-SNAPSHOT"

ext["spring-framework.version"] = "5.3.37"
ext["spring-security.version"] = "6.5.11"
ext["tomcat.version"] = "9.0.118"
ext["snakeyaml.version"] = "2.2"
ext["jackson.version"] = "2.17.3"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            exclude "msa/**"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.egovframe.go.kr/maven"
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter") {
        exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
    }
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.tomcat.embed:tomcat-embed-jasper"

    implementation("org.egovframe.rte:org.egovframe.rte.ptl.mvc:4.3.0") {
        exclude group: "javax.json.bind", module: "javax.json.bind-api"
    }
    implementation "org.egovframe.rte:org.egovframe.rte.psl.dataaccess:4.3.0"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.idgnr:4.3.0"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.property:4.3.0"

    implementation "commons-beanutils:commons-beanutils:1.11.0"
    implementation "org.apache.commons:commons-configuration2:2.15.1"
    implementation "org.apache.commons:commons-lang3:3.18.0"

    // JSON serialization
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.3"

    // JWT
    implementation "com.auth0:java-jwt:4.4.0"

    // Password hashing
    implementation "org.springframework.security:spring-security-crypto"

    // JSTL
    implementation "javax.servlet.jsp.jstl:jstl-api:1.2"
    implementation "org.apache.taglibs:taglibs-standard-impl:1.2.5"

    // MyBatis + Spring
    implementation "org.mybatis:mybatis:3.5.16"
    implementation "org.mybatis:mybatis-spring:2.1.2"

    // Connection pool
    implementation "com.zaxxer:HikariCP:5.1.0"

    // JDBC drivers
    runtimeOnly "com.oracle.database.jdbc:ojdbc8:19.27.0.0"
    runtimeOnly "org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16"
    runtimeOnly "org.postgresql:postgresql:42.7.11"
    // Servlet API for compilation
    compileOnly "javax.servlet:javax.servlet-api:3.1.0"
    /*
    Servlet 4.0 can compile with default Filter methods,
    but Tomcat 8.5 / Servlet 3.1 may still require explicit init(FilterConfig).
    Keep filter implementations compatible with Servlet 3.1.
    */
    //compileOnly "javax.servlet:javax.servlet-api:4.0.1"

    // Log4j2 bridge for SLF4J
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:2.26.0"
    runtimeOnly "org.apache.logging.log4j:log4j-api:2.26.0"
    runtimeOnly "org.apache.logging.log4j:log4j-core:2.26.0"
    runtimeOnly "org.apache.logging.log4j:log4j-web:2.26.0"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

// Compile sources as UTF-8
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("wrapper") {
    gradleVersion = "8.7"
}

war {
    archiveFileName = "jsAdmin.war"
}

bootJar {
    enabled = false
}

bootWar {
    enabled = true
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ["HTML", "JSON"]
    scanConfigurations = ["runtimeClasspath"]
    if (file("dependency-check-suppressions.xml").exists()) {
        suppressionFile = file("dependency-check-suppressions.xml").path
    }
    analyzers {
        assemblyEnabled = false
        nodeAuditEnabled = false
        retirejs {
            enabled = false
        }
    }
}
