plugins {
    id "java"
    id "war"
    id "eclipse-wtp"
    id "org.springframework.boot" version "2.7.18"
    id "io.spring.dependency-management" version "1.1.6"
}

group = "com.realhogoo"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            exclude "msa/**"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.egovframe.go.kr/maven"
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter") {
        exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
    }
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.tomcat.embed:tomcat-embed-jasper"

    implementation("org.egovframe.rte:org.egovframe.rte.ptl.mvc:4.3.0") {
        exclude group: "javax.json.bind", module: "javax.json.bind-api"
    }
    implementation "org.egovframe.rte:org.egovframe.rte.psl.dataaccess:4.3.0"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.idgnr:4.3.0"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.property:4.3.0"

    // JSON은 Jackson으로 (대부분 Spring/WebMVC가 이미 끌고 오지만 확실히 하려면 명시)
    implementation "com.fasterxml.jackson.core:jackson-databind:2.13.5"
    
    //JWT 라이브러리
    implementation "com.auth0:java-jwt:4.4.0"

    //패스워드 해싱을 쓰려면 Spring Security crypto만 가볍게
    implementation "org.springframework.security:spring-security-crypto:5.8.12"
    
    //JSTL
    implementation "javax.servlet.jsp.jstl:jstl-api:1.2"
    implementation "org.apache.taglibs:taglibs-standard-impl:1.2.5"

    // MyBatis + Spring 연동
    implementation "org.mybatis:mybatis:3.5.16"
    implementation "org.mybatis:mybatis-spring:2.1.2"

    // 커넥션 풀(가장 무난)
    implementation "com.zaxxer:HikariCP:5.1.0"

    // Oracle JDBC (운영)
    // - 버전은 설치된 Oracle/정책에 맞추세요. (JDK17이면 보통 ojdbc11 계열)
    // Oracle 11g 연결용 JDBC (JDK17에서도 동작 가능성이 높은 19c 계열 ojdbc8 권장)
    runtimeOnly "com.oracle.database.jdbc:ojdbc8:19.27.0.0"

    // H2 (개발용 사용 시)
    runtimeOnly "com.h2database:h2:2.2.224"
    
    // Tomcat이 제공(컴파일만 필요)
    compileOnly "javax.servlet:javax.servlet-api:3.1.0"
    /*
    Servlet 4.0에서는 Filter.init()/destroy()가 “default method(또는 구현 생략 가능)”처럼 동작하는 조합이 있어 doFilter()만 구현해도 컴파일이 통과할 수 있습니다.
	하지만 Tomcat 8.5(3.1) 런타임에서는 init(FilterConfig)가 abstract라서, 실행 시점에 TraceIdFilter에 해당 메서드가 없으면 **AbstractMethodError**가 납니다.
	*/
    //compileOnly "javax.servlet:javax.servlet-api:4.0.1"
    
   // ★ SLF4J 2.x 브릿지 (중요)
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:2.23.1"
	runtimeOnly "org.apache.logging.log4j:log4j-api:2.23.1"
	runtimeOnly "org.apache.logging.log4j:log4j-core:2.23.1"
	runtimeOnly "org.apache.logging.log4j:log4j-web:2.23.1"
    
    testImplementation "junit:junit:4.13.2"
}
// ★ 기존에 들어가 있던 1.7용 바인더는 제거/exclude 필요
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("wrapper") {
    gradleVersion = "8.7"
}

war {
    archiveFileName = "jsAdmin.war"
}

bootJar {
    enabled = false
}

bootWar {
    enabled = true
}
