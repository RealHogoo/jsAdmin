app.env=${APP_ENV:dev}
app.service-id=${SERVICE_ID:admin-service}
app.public-base-url=${ADMIN_SERVICE_PUBLIC_BASE_URL:http://localhost:8081}
asset.version=${ASSET_VERSION:20260421-1}
app.db.vendor=${APP_DB_VENDOR:postgres}
jwt.secret=${JWT_SECRET:}
jwt.issuer=jsAdmin
jwt.exp_seconds=${JWT_EXP_SECONDS:3600}
auth.login-rate-limit.max-attempts=${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:8}
auth.login-rate-limit.window-seconds=${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
auth.login-rate-limit.block-seconds=${AUTH_LOGIN_RATE_LIMIT_BLOCK_SECONDS:300}
auth.login-failure.short-delay-attempts=${AUTH_LOGIN_FAILURE_SHORT_DELAY_ATTEMPTS:3}
auth.login-failure.short-delay-seconds=${AUTH_LOGIN_FAILURE_SHORT_DELAY_SECONDS:60}
auth.login-failure.long-delay-attempts=${AUTH_LOGIN_FAILURE_LONG_DELAY_ATTEMPTS:5}
auth.login-failure.long-delay-seconds=${AUTH_LOGIN_FAILURE_LONG_DELAY_SECONDS:600}
auth.login-failure.account-lock-attempts=${AUTH_LOGIN_FAILURE_ACCOUNT_LOCK_ATTEMPTS:7}
auth.super.login-id=${AUTH_SUPER_LOGIN_ID:ADMIN}
service-registry.allowed-origins=${SERVICE_REGISTRY_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084}
